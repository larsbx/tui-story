SPECIFICATION Spec

CONSTANTS
    MaxVertices = 10
    MaxEdges = 50
    LayoutWidth = 100
    LayoutHeight = 50
    MinCertainty = 0.5
    MaxCertainty = 1.0

INVARIANTS
    TypeInvariant
    UniqueIds
    SequentialIds
    NoIdGaps
    ValidEdges
    UniqueEdges
    BoundedVertices
    SizeConsistency
    SymmetricRelationConsistency
    NoContradictoryRelations
    CertaintyCoherence
    StructuralInvariant
    SemanticInvariant
    GraphInvariant

PROPERTIES
    MonotonicNextId
    EventualLayout

\* State constraint to keep model checking tractable
CONSTRAINT
    Cardinality(vertices) <= 6

\* Check specific scenarios
\* INIT InitWithVertices
\* NEXT NextAddVertex
