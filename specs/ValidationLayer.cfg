SPECIFICATION Spec

CONSTANTS
    MaxLength = 1000
    MinLength = 1

INVARIANTS
    TypeInvariant
    ValidImpliesNoError
    InvalidImpliesError
    ValidatedOnlyWhenValid
    ValidatedInputBounds
    NoNullBytesInValidated
    NoControlCharsInValidated
    SanitizationConsistency
    EmptyNeverValid
    OverLengthNeverValid
    ErrorTypeConsistency
    SafetyInvariant
    DefenseInDepth
    NoBypass
    FailSafe
    SecurityInvariant

PROPERTIES
    EventuallyValidated
    EventuallyReady
    ValidProducesOutput

\* State constraint
CONSTRAINT
    Len(rawInput) <= 100
