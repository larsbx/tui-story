SPECIFICATION Spec

CONSTANTS
    MaxRetries = 3
    InitialBackoff = 1000
    TimeoutMs = 30000
    MaxBackoff = 8000

INVARIANTS
    TypeInvariant
    RetryBound
    ValidBackoff
    StateConsistency
    MockModeNoBackoff
    RetryOnlyRetryableErrors
    SafetyInvariant

PROPERTIES
    EventuallyTerminates
    EventuallyIdle
    MockModeImmediate
    MaxRetriesLeadsToFailure
    ImmediateFailureForNonRetryable

\* Fairness to ensure progress
\* This ensures that backoff timers eventually expire
\* and retries eventually happen
FAIRNESS
    WF_vars(Next)

\* State constraint
CONSTRAINT
    requestId <= 10
