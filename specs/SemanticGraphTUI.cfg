SPECIFICATION Spec

CONSTANTS
    MaxIdeas = 10           \* MODEL CHECKING CONSTRAINT ONLY - not a system limit!
                            \* Actual implementation supports unlimited ideas (memory-bound)
    MaxContentLength = 1000 \* Real implementation constraint from validation.zig
    MaxRetries = 3          \* Real implementation constraint from llm.zig
    NumGroups = 2           \* Real implementation constraint (two-group analysis)

INVARIANTS
    TypeInvariant
    UniqueVertexIds
    SequentialVertexIds
    ValidEdgeReferences
    NoSelfLoops
    AnalysisConsistency
    InputLengthBound
    IdeasMatchVertices
    ValidCoordinates
    DeterministicTransitions
    SafetyInvariant

PROPERTIES
    EventuallyCompletesAnalysis
    AnalysisEventuallyTerminates

\* Symmetry reduction for better performance
\* SYMMETRY Permutations

\* State constraint to limit state space
CONSTRAINT
    Cardinality(vertices) <= 5

\* Action constraints for focused verification
\* ACTION_CONSTRAINT
\*     /\ Len(ideas) <= 5
\*     /\ Cardinality(edges) <= 20
