SPECIFICATION Spec

CONSTANTS
    MaxIdeas = 10
    MaxContentLength = 1000
    MaxRetries = 3
    NumGroups = 2

INVARIANTS
    TypeInvariant
    UniqueVertexIds
    SequentialVertexIds
    ValidEdgeReferences
    NoSelfLoops
    AnalysisConsistency
    InputLengthBound
    IdeasMatchVertices
    ValidCoordinates
    DeterministicTransitions
    SafetyInvariant

PROPERTIES
    EventuallyCompletesAnalysis
    AnalysisEventuallyTerminates

\* Symmetry reduction for better performance
\* SYMMETRY Permutations

\* State constraint to limit state space
CONSTRAINT
    Cardinality(vertices) <= 5

\* Action constraints for focused verification
\* ACTION_CONSTRAINT
\*     /\ Len(ideas) <= 5
\*     /\ Cardinality(edges) <= 20
