version = 1
repository = "larsbx/tui-story"
branch = "main"
boundary_id = "tui-command"
fail_closed = true
authority_change = false
ci_wiring = false

[authority]
primary_languages = ["Elixir"]
supporting_languages = ["Gleam"]
