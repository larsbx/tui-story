[book]
title = "tui-story Documentation"
authors = ["larsbx"]
description = "Documentation for tui-story: Semantic Relationship Graph TUI"
language = "en"
multilingual = false
src = "docs/book"

[build]
build-dir = "book"
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
default-theme = "ayu"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/larsbx/tui-story"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/larsbx/tui-story/edit/main/{path}"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.print]
enable = true

[output.linkcheck]
follow-web-links = false
exclude = ["http://www.hemingwayapp.com"]
