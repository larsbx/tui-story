services:
  # The graph itself. It used to live in ETS inside the application, which meant
  # it did not survive a restart; Neo4j held a separate, unrelated table of text.
  postgres:
    image: postgres:16-alpine
    container_name: semantic_graph_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: semantic_graph_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - semantic_graph_network

volumes:
  postgres_data:
    driver: local

networks:
  semantic_graph_network:
    driver: bridge
