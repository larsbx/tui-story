# Vale configuration for tui-story documentation
# See: https://vale.sh/docs/topics/config/

StylesPath = .vale/styles
MinAlertLevel = suggestion

# Global settings
[*]
BasedOnStyles = Vale, write-good

# Vocabulary file (project-specific terms)
Vocab = tui-story

[*.md]
# Apply stricter rules to Markdown documentation
BasedOnStyles = Vale, write-good, alex

# Ignore code blocks
BlockIgnores = (?s) *```(?:zig|bash|yaml|json|toml)?.+?```

# Ignore inline code
TokenIgnores = (?s)`[^`]+`

# Ignore URLs
TokenIgnores = https?://[^\s]+

[*.{zig,c,h}]
# Lighter linting for source code comments
BasedOnStyles = Vale

[*.{yaml,yml,json,toml}]
# Minimal linting for configuration files
BasedOnStyles = Vale
MinAlertLevel = error
