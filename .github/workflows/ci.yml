name: CI

# This workflow used to build and test a Zig project. There is no Zig in this
# repository -- it was replaced by the Elixir code below, and the workflow was
# never updated, so every run from 2025-11 onward failed on a missing src/
# directory rather than on anything real. What follows exercises the code that
# is actually here.

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  semantic_graph:
    name: semantic_graph (Elixir)
    runs-on: ubuntu-latest

    services:
      # The graph lives here. `mix test` creates and migrates this database
      # through the alias in mix.exs before running a single test.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      # Pinned, not floating: mix.lock carries cowlib 2.20, whose cow_capsule
      # module uses the `maybe` expression. That needs OTP 27 -- on OTP 25 or 26
      # the dependency does not compile at all.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3'
          elixir-version: '1.17.3'

      # ratatouille -> ex_termbox builds its C library with a vendored copy of
      # waf that opens files in mode 'rU', which Python removed in 3.11. The
      # runner's default interpreter is newer, so give waf one it can run under.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/cache@v4
        with:
          path: |
            semantic_graph/deps
            semantic_graph/_build
          key: ${{ runner.os }}-otp27-mix-${{ hashFiles('semantic_graph/mix.lock') }}
          restore-keys: ${{ runner.os }}-otp27-mix-

      - name: Fetch dependencies
        run: mix deps.get
        working-directory: semantic_graph

      - name: Compile
        run: mix compile
        working-directory: semantic_graph

      - name: Test
        run: mix test
        working-directory: semantic_graph

  auto_agent:
    name: auto_agent (Elixir)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3'
          elixir-version: '1.17.3'

      - uses: actions/cache@v4
        with:
          path: |
            auto_agent/deps
            auto_agent/_build
          key: ${{ runner.os }}-otp27-mix-agent-${{ hashFiles('auto_agent/mix.lock') }}
          restore-keys: ${{ runner.os }}-otp27-mix-agent-

      - name: Fetch dependencies
        run: mix deps.get
        working-directory: auto_agent

      # auto_agent has no test directory yet. Compiling is the whole gate here,
      # and saying so is better than a test step that runs nothing and passes.
      - name: Compile
        run: mix compile
        working-directory: auto_agent
