name: CI

# This workflow used to build and test a Zig project. There is no Zig in this
# repository -- it was replaced by the Elixir and Python code below, and the
# workflow was never updated, so every run from 2025-11 onward failed on a
# missing src/ directory rather than on anything real. What follows exercises
# the code that is actually here.

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  semantic_graph:
    name: semantic_graph (Elixir)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not floating: mix.lock carries cowlib 2.20, whose cow_capsule
      # module uses the `maybe` expression. That needs OTP 27 -- on OTP 25 or 26
      # the dependency does not compile at all.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3'
          elixir-version: '1.17.3'

      # ratatouille -> ex_termbox builds its C library with a vendored copy of
      # waf that opens files in mode 'rU', which Python removed in 3.11. The
      # runner's default interpreter is newer, so give waf one it can run under.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/cache@v4
        with:
          path: |
            semantic_graph/deps
            semantic_graph/_build
          key: ${{ runner.os }}-otp27-mix-${{ hashFiles('semantic_graph/mix.lock') }}
          restore-keys: ${{ runner.os }}-otp27-mix-

      - name: Fetch dependencies
        run: mix deps.get
        working-directory: semantic_graph

      - name: Compile
        run: mix compile
        working-directory: semantic_graph

      - name: Test
        run: mix test
        working-directory: semantic_graph

  auto_agent:
    name: auto_agent (Elixir)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3'
          elixir-version: '1.17.3'

      - uses: actions/cache@v4
        with:
          path: |
            auto_agent/deps
            auto_agent/_build
          key: ${{ runner.os }}-otp27-mix-agent-${{ hashFiles('auto_agent/mix.lock') }}
          restore-keys: ${{ runner.os }}-otp27-mix-agent-

      - name: Fetch dependencies
        run: mix deps.get
        working-directory: auto_agent

      # auto_agent has no test directory yet. Compiling is the whole gate here,
      # and saying so is better than a test step that runs nothing and passes.
      - name: Compile
        run: mix compile
        working-directory: auto_agent

  graphiti_service:
    name: graphiti_service (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: graphiti_service/requirements.txt

      # This install is itself the check that caught the pins being
      # unsatisfiable: graphiti-core 0.28.2 needs neo4j>=5.26.0, and the file
      # still pinned 5.14.0, so pip could not resolve the set at all.
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: graphiti_service

      - name: Every module imports
        run: python -c "import config, models, graphiti_client, main"
        working-directory: graphiti_service
